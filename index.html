<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            /*
             * Kami design tokens (mirrored in src/Theme.elm; keep both in sync).
             * Warm parchment canvas, ink-blue accent, warm neutrals only.
             */
            :root {
              --parchment: #f5f4ed;
              --ivory: #faf9f5;
              --warm-sand: #e8e6dc;
              --near-black: #141413;
              --dark-warm: #3d3d3a;
              --olive: #504e49;
              --stone: #6b6a64;
              --border: #e8e6dc;
              --border-soft: #e5e3d8;
              --brand: #1B365D;
              --brand-light: #2D5A8A;
              --chip-bg: #E4ECF5;
              --brand-tint: #EEF2F7;
              --error-bg: #f0e0d8;
              --error-fg: #8b4513;
              --sans: system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            }

            html,
            body {
              margin: 0;
              height: 100vh;
            }

            body {
              background-color: var(--parchment);
              color: var(--near-black);
              font-family: var(--sans);
            }

            body > div { height: 100vh; }

            .error {
              color: var(--error-fg) !important;
              cursor: pointer;
              text-decoration-line: underline;
              text-decoration-style: wavy;
              font-style: oblique;
            }

            /* Thin, inset warm scrollbar; no cool-gray track. */
            ::-webkit-scrollbar { width: 10px; height: 10px; background: transparent; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb {
              background-color: var(--stone);
              border: 4px solid transparent;
              background-clip: content-box;
              border-radius: 999px;
              min-height: 32px;
              min-width: 32px;

            }

            .elm-select-input-wrapper {
              display: flex;
              position: relative;
              overflow: hidden;
              background-color: var(--ivory);
              padding: 3px 4px;
              border: 1px solid var(--border);
              border-radius: 8px;
              color: var(--dark-warm);
            }

            .elm-select-input {
              flex: 1;
              outline: none;
              border: none;
              background-color: transparent;
              color: var(--dark-warm);
              font-family: var(--sans);
            }

            .elm-select-clear {
              cursor: pointer;
              height: 1rem;
              line-height: 1rem;
              margin-top: -0.5rem;
              position: absolute;
              right: 0.25rem;
              top: 50%;
            }

            .elm-select-multi-input-item-container {
              display: flex;
              flex-direction: row;
              align-items: center;
              justify-content: center;
            }

            .elm-select-multi-input-item {
              display: flex;
              border-width: 1px;
              background-color: var(--warm-sand);
              color: var(--dark-warm);
              border-radius: 8px;
              margin-right: 4px;
              padding: 2px 8px;
            }

            .elm-select-multi-input-item-text {
              text-overflow: ellipsis;
            }

            .elm-select-multi-input-item-remove {
              display: flex;
              align-items: center;
              justify-content: center;
            }

            .elm-select-multi-item-remove {
              cursor: pointer;
              padding-top: 1px;
              line-height: 0px;
            }

            /* Menu */

            .elm-select-menu-anchor {
              position: relative;
            }

            .elm-select-menu {
              position: absolute;
              z-index: 1;
              background-color: var(--ivory);
              min-width: 8rem;
              border: 1px solid var(--border);
              border-radius: 8px;
              box-shadow: 0 6px 16px rgba(20, 20, 19, 0.10);
              max-height:  20rem;
              overflow-y: auto;
              font-family: var(--sans);
            }

            .elm-select-menu-item {
              padding: 2px;
            }

            .elm-select-menu-item-selectable {
              cursor: pointer;
            }

            .elm-select-menu-item-selectable:hover {
              background-color: var(--warm-sand);
            }

            /* Underline */

            .elm-select-input-underline-wrapper {
              position:  relative;
            }

            .elm-select-input-underline:before,
            .elm-select-input-underline:after {
              content: '';
              height: 2px;
              width: 0;
              position: absolute;
              background: rgb(204, 204, 204);
              -webkit-transition: 0.2s ease all;
              -moz-transition: 0.2s ease all;
              -o-transition: 0.2s ease all;
              transition: 0.2s ease all;
            }

            .elm-select-input-underline:before {
              left: 50%;
            }

            .elm-select-input-underline:after {
              right: 50%;
            }

            .elm-select:focus-within .elm-select-input-underline:before,
            .elm-select:focus-within .elm-select-input-underline:after {
              width: 50%;
            }

            /* Secondary button variant. Primary is styled per call site. */
            button {
              background-color: var(--warm-sand);
              border: 1px solid var(--border);
              border-radius: 8px;
              color: var(--dark-warm);
              font-family: var(--sans);
            }

            button:hover:not(:disabled) {
              background-color: var(--ivory);
            }

            button > svg {
              stroke: var(--dark-warm);
            }

            button:disabled,
            button[disabled]{
              border: 1px solid var(--border-soft);
              background-color: var(--ivory);
              color: var(--stone);
            }

            button:disabled > svg, button[disabled] > svg {
              stroke: var(--stone);
            }

            div.hover-contents h4 {
              margin: 0;
            }

            .highlighted-text {
              background-color: var(--brand-tint);
            }
          </style>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Author: Yauhen Pyl, Category: Software Design, Software Architecture, Modeling, C4 Model, Elm-lang">
        <base href="/">
        <link rel="icon" href="data:;base64,iVBORw0KGgo=">
        <meta name="theme-color" content="#1B365D">
    </head>
    <body>
        <div id="root"></div>
        <script src="./index.js" type="module"></script>
    </body>
</html>
